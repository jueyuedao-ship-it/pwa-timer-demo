<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timer">

  <title>PWA Timer Demo</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="app">
    <section class="card">
      <div class="eyebrow">PWA TIMER DEMO</div>

      <h1>Timer</h1>

      <div
        class="timer"
        id="timer"
        aria-live="polite"
      >
        05:00
      </div>

      <div
        class="presets"
        aria-label="時間プリセット"
      >
        <button
          class="preset"
          data-minutes="1"
        >
          1分
        </button>

        <button
          class="preset active"
          data-minutes="5"
        >
          5分
        </button>

        <button
          class="preset"
          data-minutes="10"
        >
          10分
        </button>

        <button
          class="preset"
          data-minutes="25"
        >
          25分
        </button>
      </div>

      <div class="controls">
        <button
          id="startPause"
          class="primary"
        >
          開始
        </button>

        <button
          id="reset"
          class="secondary"
        >
          リセット
        </button>
      </div>

      <div class="status">
        <span id="pwaStatus">
          通常表示
        </span>

        <span id="networkStatus">
          オンライン
        </span>
      </div>
    </section>

    <p class="hint">
      iPhoneではSafariの共有メニューから「ホーム画面に追加」すると、
      PWAとして単独起動できます。
    </p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
